<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PULSE — a tiny rhythm game</title>
<style>
  :root{
    --bg: #0b0d17;
    --panel: #12162a;
    --line: #24284a;
    --text: #e9eaf5;
    --dim: #8288ad;
    --lane1: #ff3d7f; /* D */
    --lane2: #08d9d6; /* F */
    --lane3: #f9c74f; /* J */
    --lane4: #9d4dff; /* K */
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; height:100%; background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app{
    display:flex; flex-direction:column; align-items:center;
    height:100%; padding: 18px; user-select:none;
  }
  header{
    display:flex; justify-content:space-between; align-items:center;
    width:100%; max-width:560px; margin-bottom:10px;
  }
  h1{
    font-size: 26px; letter-spacing: 6px; margin:0;
    color:#fff; text-shadow: 0 0 10px var(--lane4), 0 0 24px rgba(157,77,255,.5);
  }
  .stats{ display:flex; gap:16px; font-variant-numeric: tabular-nums; font-size:14px; color:var(--dim); }
  .stats b{ color:var(--text); font-size:16px; }
  #combo-flash{
    position:absolute; top: 70px; left:50%; transform:translateX(-50%);
    font-size:15px; font-weight:700; letter-spacing:2px; opacity:0; pointer-events:none;
    transition: opacity .15s;
  }

  #field{
    position:relative; width: 340px; max-width:90vw; height: 480px;
    background: linear-gradient(180deg, var(--panel), #0e1124);
    border: 1px solid var(--line); border-radius: 10px; overflow:hidden;
    box-shadow: 0 0 40px rgba(0,0,0,.4) inset;
  }
  .lane{
    position:absolute; top:0; bottom:0; width:25%;
    border-right: 1px solid var(--line);
  }
  .lane:last-child{ border-right:none; }
  .lane[data-l="0"]{ left:0%; } .lane[data-l="1"]{ left:25%; }
  .lane[data-l="2"]{ left:50%; } .lane[data-l="3"]{ left:75%; }

  .hitline{
    position:absolute; left:0; right:0; bottom: 64px; height: 4px;
    background: rgba(255,255,255,.15);
  }
  .keycap{
    position:absolute; bottom: 12px; width: 25%; text-align:center;
    font-weight:800; font-size:18px; padding: 8px 0; border-radius:8px;
    transition: transform .06s, box-shadow .12s;
  }
  .keycap[data-l="0"]{ left:0%; color:var(--lane1); }
  .keycap[data-l="1"]{ left:25%; color:var(--lane2); }
  .keycap[data-l="2"]{ left:50%; color:var(--lane3); }
  .keycap[data-l="3"]{ left:75%; color:var(--lane4); }
  .keycap.active{ transform: scale(0.9); box-shadow: 0 0 20px currentColor; }

  .note{
    position:absolute; width: 70%; left:15%; height: 20px; border-radius:6px;
    box-shadow: 0 0 12px currentColor;
  }
  .note.l0{ background: var(--lane1); color:var(--lane1); }
  .note.l1{ background: var(--lane2); color:var(--lane2); }
  .note.l2{ background: var(--lane3); color:var(--lane3); }
  .note.l3{ background: var(--lane4); color:var(--lane4); }

  .judge{
    position:absolute; left:50%; bottom: 90px; transform: translateX(-50%);
    font-size:20px; font-weight:800; opacity:0; pointer-events:none;
    transition: opacity .2s, transform .2s;
  }

  #overlay{
    position:absolute; inset:0; background: rgba(5,6,14,.9);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap: 14px; padding: 20px;
  }
  #overlay h2{ margin:0; font-size:20px; letter-spacing:3px; }
  #overlay p{ margin:0; color: var(--dim); font-size:14px; max-width:280px; line-height:1.5;}
  button{
    background: var(--lane4); color:#fff; border:none; padding: 12px 26px;
    border-radius: 30px; font-weight:800; letter-spacing:1px; font-size:14px;
    cursor:pointer; box-shadow: 0 0 20px rgba(157,77,255,.5);
  }
  button:hover{ filter: brightness(1.1); }
  footer{ margin-top:12px; color:var(--dim); font-size:12px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>PULSE</h1>
    <div class="stats">
      <div>SCORE<br><b id="score">0</b></div>
      <div>COMBO<br><b id="combo">0</b></div>
      <div>ACC<br><b id="acc">100%</b></div>
    </div>
  </header>

  <div id="field">
    <div class="lane" data-l="0"></div>
    <div class="lane" data-l="1"></div>
    <div class="lane" data-l="2"></div>
    <div class="lane" data-l="3"></div>
    <div class="hitline"></div>
    <div class="judge" id="judge"></div>
    <div class="keycap" data-l="0">D</div>
    <div class="keycap" data-l="1">F</div>
    <div class="keycap" data-l="2">J</div>
    <div class="keycap" data-l="3">K</div>

    <div id="overlay">
      <h2>PULSE</h2>
      <p>Hit D · F · J · K as the bars cross the line. Perfect timing = bigger score. Miss too many and your combo resets.</p>
      <button id="startBtn">PRESS TO START</button>
      <footer>or press SPACE</footer>
    </div>
  </div>

  <footer>60 seconds. Stay on beat. Good luck.</footer>
</div>

<script>
(() => {
  const KEYS = ['d','f','j','k'];
  const laneColors = ['#ff3d7f','#08d9d6','#f9c74f','#9d4dff'];
  const field = document.getElementById('field');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const comboEl = document.getElementById('combo');
  const accEl = document.getElementById('acc');
  const judgeEl = document.getElementById('judge');
  const keycaps = document.querySelectorAll('.keycap');

  const FIELD_H = 480;
  const HIT_Y = FIELD_H - 64;      // pixel position of hit line
  const TRAVEL_MS = 1500;          // time a note takes to fall to the line
  const BPM = 118;
  const BEAT_MS = 60000 / BPM;
  const SONG_BEATS = Math.floor(60000 / BEAT_MS); // ~60 seconds of beats

  let audioCtx = null;
  let startTime = 0;               // audioCtx time at song start
  let notes = [];                  // {lane, hitTime(ms since start), el, judged}
  let score = 0, combo = 0, maxCombo = 0, hits = 0, total = 0;
  let running = false;
  let rafId = null;
  let songTimeout = null;

  function beep(freq, dur, gainVal, whenSec, type='sine'){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainVal, whenSec);
    gain.gain.exponentialRampToValueAtTime(0.001, whenSec + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(whenSec);
    osc.stop(whenSec + dur + 0.02);
  }

  function buildPattern(){
    // simple procedurally varied lane pattern, gets busier over time
    const pattern = [];
    for(let b = 0; b < SONG_BEATS; b++){
      const beatMs = b * BEAT_MS;
      const density = b < 8 ? 1 : (b % 8 === 0 ? 2 : (Math.random() < 0.35 ? 2 : 1));
      const usedLanes = new Set();
      for(let k = 0; k < density; k++){
        let lane = Math.floor(Math.random() * 4);
        if(usedLanes.has(lane)) continue;
        usedLanes.add(lane);
        pattern.push({ lane, hitTime: beatMs });
      }
    }
    return pattern;
  }

  // a small A-minor synthwave loop: bass riff + pad chords + soft hats
  const BASS_RIFF = [220.00, 220.00, 261.63, 293.66, 220.00, 196.00, 174.61, 196.00]; // A C D A G F G
  const CHORDS = [
    [220.00, 261.63, 329.63],   // A minor
    [174.61, 220.00, 261.63],   // F major
    [196.00, 246.94, 293.66],   // G major
    [220.00, 261.63, 329.63],   // A minor
  ];

  function playSong(){
    for(let b = 0; b < SONG_BEATS; b++){
      const t = startTime + (b * BEAT_MS) / 1000;

      // bass note every beat
      beep(BASS_RIFF[b % BASS_RIFF.length], BEAT_MS/1000 * 0.9, 0.09, t, 'sawtooth');

      // soft pad chord every 4 beats, long sustain
      if(b % 4 === 0){
        const chord = CHORDS[(b / 4) % CHORDS.length];
        chord.forEach(freq => beep(freq * 2, (BEAT_MS * 4)/1000 * 0.95, 0.02, t, 'triangle'));
      }

      // hi-hat on every beat, accented on the downbeat
      beep(b % 4 === 0 ? 1600 : 1200, 0.035, b % 4 === 0 ? 0.035 : 0.018, t, 'square');
    }
  }

  function reset(){
    field.querySelectorAll('.note').forEach(n => n.remove());
    notes = [];
    score = 0; combo = 0; maxCombo = 0; hits = 0; total = 0;
    scoreEl.textContent = '0';
    comboEl.textContent = '0';
    accEl.textContent = '100%';
  }

  function startGame(){
    if(running) return;
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    reset();
    overlay.style.display = 'none';
    running = true;

    const pattern = buildPattern();
    startTime = audioCtx.currentTime + 0.3;

    // schedule background music (bass riff + pad chords + hi-hats) + create note elements
    playSong();
    pattern.forEach(n => {
      const el = document.createElement('div');
      el.className = 'note l' + n.lane;
      el.style.top = '-24px';
      field.appendChild(el);
      notes.push({ lane: n.lane, hitTime: n.hitTime, el, judged: false });
      total++;
    });

    rafId = requestAnimationFrame(tick);
    songTimeout = setTimeout(endGame, SONG_BEATS * BEAT_MS + TRAVEL_MS + 400);
  }

  function tick(){
    if(!running) return;
    const nowMs = (audioCtx.currentTime - startTime) * 1000;

    notes.forEach(n => {
      if(n.judged) return;
      const spawnMs = n.hitTime - TRAVEL_MS;
      const progress = (nowMs - spawnMs) / TRAVEL_MS;
      const y = progress * HIT_Y;
      n.el.style.top = y + 'px';

      if(nowMs - n.hitTime > 180 && !n.judged){
        // auto-miss if passed the window untouched
        n.judged = true;
        n.el.remove();
        registerMiss();
      }
    });

    rafId = requestAnimationFrame(tick);
  }

  function registerMiss(){
    combo = 0;
    comboEl.textContent = combo;
    showJudge('MISS', '#8288ad');
    updateAcc();
  }

  function updateAcc(){
    accEl.textContent = total ? Math.round((hits/total)*100) + '%' : '100%';
  }

  function showJudge(text, color){
    judgeEl.textContent = text;
    judgeEl.style.color = color;
    judgeEl.style.opacity = '1';
    judgeEl.style.transform = 'translateX(-50%) translateY(-6px)';
    clearTimeout(showJudge._t);
    showJudge._t = setTimeout(() => {
      judgeEl.style.opacity = '0';
      judgeEl.style.transform = 'translateX(-50%) translateY(0)';
    }, 220);
  }

  function pressLane(lane){
    const cap = document.querySelector('.keycap[data-l="'+lane+'"]');
    cap.classList.add('active');
    setTimeout(() => cap.classList.remove('active'), 90);
    if(!running) return;

    const nowMs = (audioCtx.currentTime - startTime) * 1000;
    // find closest unjudged note in this lane within timing window
    let best = null, bestDiff = Infinity;
    notes.forEach(n => {
      if(n.judged || n.lane !== lane) return;
      const diff = Math.abs(nowMs - n.hitTime);
      if(diff < bestDiff){ bestDiff = diff; best = n; }
    });

    if(best && bestDiff <= 180){
      best.judged = true;
      best.el.remove();
      hits++;
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      let gained, label, color;
      if(bestDiff <= 60){ gained = 100; label = 'PERFECT'; color = '#f9c74f'; }
      else if(bestDiff <= 120){ gained = 60; label = 'GOOD'; color = '#08d9d6'; }
      else { gained = 30; label = 'OK'; color = '#9d4dff'; }
      score += gained + Math.min(combo, 50);
      scoreEl.textContent = score;
      comboEl.textContent = combo;
      updateAcc();
      showJudge(label, color);
      beep(330 + lane * 90, 0.08, 0.05, audioCtx.currentTime, 'triangle');
    }
  }

  function endGame(){
    running = false;
    cancelAnimationFrame(rafId);
    notes.forEach(n => { if(!n.judged) n.el.remove(); });

    const acc = total ? Math.round((hits/total)*100) : 100;
    let rank = 'C';
    if(acc >= 95) rank = 'S';
    else if(acc >= 85) rank = 'A';
    else if(acc >= 70) rank = 'B';

    overlay.innerHTML = `
      <h2>TRACK COMPLETE</h2>
      <p style="font-size:28px; font-weight:800; color:#fff; margin:0;">Rank ${rank}</p>
      <p>Score: ${score}<br>Max combo: ${maxCombo}<br>Accuracy: ${acc}%</p>
      <button id="startBtn">PLAY AGAIN</button>
      <footer>or press SPACE</footer>
    `;
    overlay.style.display = 'flex';
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  startBtn.addEventListener('click', startGame);
  window.addEventListener('keydown', (e) => {
    if(e.repeat) return;
    if(e.code === 'Space'){
      e.preventDefault();
      if(overlay.style.display !== 'none') startGame();
      return;
    }
    const idx = KEYS.indexOf(e.key.toLowerCase());
    if(idx !== -1) pressLane(idx);
  });
})();
</script>
</body>
</html>
